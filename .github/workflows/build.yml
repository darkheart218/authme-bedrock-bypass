name: Build EmoteBridge

# Build otomatis setiap ada push/PR ke branch main, dan bisa juga dijalankan manual
# lewat tab "Actions" di GitHub (tombol "Run workflow").
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Tidak perlu commit gradlew/gradle-wrapper - action ini yang
      # menyediakan Gradle-nya, sekaligus cache dependency biar build berikutnya cepat.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build jar
        run: gradle build

      # Hasil jar bisa diunduh dari halaman run workflow ini,
      # di bagian "Artifacts" (tersedia beberapa hari, bukan release permanen).
      - name: Upload hasil build
        uses: actions/upload-artifact@v4
        with:
          name: EmoteBridge-jar
          path: build/libs/*.jar
