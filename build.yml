name: Build Plugin

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      # Build cuma sekali pakai JDK 21. Karena pom.xml sudah di-set
      # maven.compiler.release=17, hasil .jar-nya TETAP jalan di Java 17, 21, maupun 26.
      # Tidak perlu build 3x untuk 3 versi Java.
      - name: Setup Java 21 (dipakai buat proses build)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build dengan Maven
        run: mvn -B clean package

      # Sanity check: mastiin bytecode hasil compile beneran level Java 17 (class version 61),
      # bukan kebawa ikut versi JDK build (21). Kalau ini gagal, cek maven.compiler.release di pom.xml.
      - name: Cek versi bytecode hasil compile
        run: |
          CLASS_FILE=$(find target/classes -name "*.class" | head -n 1)
          javap -verbose "$CLASS_FILE" | grep "major version"

      - name: Upload hasil .jar
        uses: actions/upload-artifact@v4
        with:
          name: AuthMeBedrockBypass-jar
          path: target/*.jar
