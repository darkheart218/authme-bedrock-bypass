# Daftar emote yang tampil di menu /emotewheel untuk pemain Bedrock.
# key   = nama yang muncul di tombol menu
# value = nama emote persis seperti yang kamu daftarkan di Emotecraft
#         (nama yang biasa kamu ketik di /emotes play <nama>)
emotes:
  "Wave": "wave"
  "Dance": "dance"
  "Sit": "sit"
  "Clap": "clap"
  "Cry": "cry"
  "Laugh": "laugh"
# Ganti/tambah baris di atas sesuai emote yang benar-benar sudah kamu isi
# di folder emote server-mu.

# Pengaturan indikator yang dilihat pemain Bedrock saat pemain Java ber-emote
indicator:
  particle: "HEART" # nama Particle enum Bukkit, ganti sesuai selera
  particle-count: 15
  sound: "ENTITY_PLAYER_LEVELUP"
  sound-volume: 0.6
  sound-pitch: 1.4
  actionbar-format: "&d✦ %player% sedang ber-emote: %emote%"
  radius: 24.0
